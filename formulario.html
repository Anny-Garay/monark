<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="formulario-body">
    <div class="fondo-blanco">
        <form class="formulario">
            <h4 class="titulo-formulario">INGRESE SUS DATOS</h4>
            <div class="nombre">
                <label for="nombre">Nombre del padre</label>
                <br>
                <input type="text" id="nombre" required>
            </div>
            <div class="numero">
                <label for="nombre">Número de celular</label>
                <br>
                <input type="text" id="numero" required>
            </div>
            <div class="email">
                <label for="nombre">Email</label>
                <br>
                <input type="email" id="email" required>
            </div>
            <div class="nombre">
                <label for="nombre">Nombre del niño(a)</label>
                <br>
                <input type="text" id="nombre" required>
            </div>
            <div class="genero">
                <label for="genero">Género</label>
                <br>
                <select name="Género" id="genero">
                    <option value="">Selecciona un género</option>
                    <option value="Niña">Niña</option>
                    <option value="Niño">Niño</option>
                </select>
            </div>
            <div class="edad">
                <label for="edad">Edad</label>
                <br>
                <select name="Edad" id="edad">
                    <option value="">Selecciona una edad</option>
                    <option value="">De 2 a 4 años</option>
                    <option value="">De 4 a 6 años</option>
                    <option value="">De 6 a 9 años</option>
                    <option value="">De 9 a 12 años</option>
                    <option value="">De 12 a + años</option>
                </select>
            </div>
            <div class="formulario-boton">
                <input type="button" class="submit-boton" value="SIGUIENTE" onclick="window.location.href='producto.html'">
            </div>
        </form>
    </div>
    
</body>
</html>
