<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="formulario-body">
    <div class="fondo-blanco-paso2">
        <form class="formulario-paso2">
            <h3 class="titulo-formulario">PASO 2</h3>
            <label for="nombre">Datos del padre/madre</label>
            <h4 class="subtitulo-formulario">Completa todos los campos para poder generar el video</h4>
            <div class="nombre">
                <label for="nombre">Nombres y apellidos*</label>
                <br>
                <input type="text" id="nombre" required>
            </div>
            <div class="numero">
                <label for="nombre">Número de celular*</label>
                <br>
                <input type="number" id="numero" required>
            </div>
            <div class="email">
                <label for="nombre">E-mail*</label>
                <br>
                <input type="email" id="email" required>
            </div>
            <div class="condiciones-uso">
                <input type="checkbox" name="condicionesUso" id="condicionesUso" required>
                <label for="condicionesUso">He leído y acepto las <a class="enlace-form-paso2" href= "https://www.monark.com.pe/textos-legales/" target="_blank">Condiciones de Uso</a></label> 
            </div>
            <div class="politicas-privacidad">
                <input type="checkbox" name="politicasPrivacidad" id="politicasPrivacidad" required>
                <label for="politicasPrivacidad">He leído y acepto las <a class="enlace-form-paso2" href="https://www.monark.com.pe/politica-privacidad/" target="_blank">Políticas de Privacidad</a></label>
            </div>
            <div class="formulario-boton">
                <input type="button" class="submit-boton" value="SIGUIENTE" onclick="window.location.href='producto.html'">
            </div>
        </form>
    </div>
    
</body>
</html>
